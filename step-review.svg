<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#3a2a2e"/>
      <stop offset="0.55" stop-color="#1e1719"/>
      <stop offset="1" stop-color="#0d0b0c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9c5966" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9c5966" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#fff4ec" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#fff4ec" stop-opacity="0.95"/>
      <stop offset="0.9" stop-color="#fff4ec" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff4ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1ed"/>
      <stop offset="1" stop-color="#e9ded6"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c7f73"/><stop offset="1" stop-color="#3d2f2b"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d4a4e"/><stop offset="1" stop-color="#1e1719"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="screen"><rect x="0" y="0" width="420" height="820" rx="44"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="800" cy="520" rx="640" ry="420" fill="url(#glow)"/>

  <!-- ring light, left -->
  <g transform="translate(390 430)">
    <circle r="230" fill="url(#ring)"/>
    <circle r="178" fill="none" stroke="#fff4ec" stroke-width="22" opacity="0.9"/>
    <rect x="-6" y="190" width="12" height="400" fill="#0f0d0e"/>
  </g>

  <!-- published video card, right -->
  <g transform="translate(980 300) rotate(6)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="400" rx="24" fill="url(#paper)"/>
    <rect x="18" y="18" width="324" height="200" rx="14" fill="url(#thumb)"/>
    <circle cx="180" cy="118" r="38" fill="#f6f1ed" opacity="0.92"/>
    <path d="M168 98 v40 l32 -20 z" fill="#401b27"/>
    <rect x="18" y="246" width="250" height="22" rx="11" fill="#191719"/>
    <rect x="18" y="282" width="190" height="22" rx="11" fill="#191719" opacity="0.85"/>
    <rect x="18" y="330" width="140" height="16" rx="8" fill="#cbbab1"/>
    <circle cx="316" cy="338" r="18" fill="#401b27"/>
    <path d="M308 338 l6 6 l11 -12" stroke="#f6f1ed" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- phone recording the review, front -->
  <g transform="translate(590 90)" filter="url(#shadow)">
    <rect x="-16" y="-16" width="452" height="852" rx="58" fill="#0f0d0e"/>
    <g clip-path="url(#screen)">
      <rect width="420" height="820" fill="#1b1618"/>

      <!-- the profile being reviewed -->
      <rect x="34" y="96" width="352" height="560" rx="18" fill="url(#paper)"/>
      <rect x="58" y="122" width="150" height="20" rx="10" fill="#191719" opacity="0.85"/>
      <rect x="58" y="160" width="304" height="300" rx="14" fill="url(#photo)"/>
      <circle cx="210" cy="272" r="50" fill="#000" opacity="0.16"/>
      <path d="M136 460 q74 -120 148 0 z" fill="#000" opacity="0.16"/>
      <rect x="58" y="480" width="304" height="150" rx="14" fill="#ffffff"/>
      <rect x="80" y="504" width="150" height="14" rx="7" fill="#cbbab1"/>
      <rect x="80" y="536" width="240" height="20" rx="10" fill="#191719" opacity="0.8"/>
      <rect x="80" y="566" width="200" height="20" rx="10" fill="#191719" opacity="0.8"/>
      <rect x="80" y="596" width="160" height="20" rx="10" fill="#191719" opacity="0.8"/>

      <!-- marker annotations -->
      <g fill="none" stroke="#c2566b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M70 548 c40 -38 220 -46 280 -6 c40 30 -20 84 -150 86 c-120 2 -170 -40 -130 -80"/>
      </g>
      <g transform="translate(232 180)">
        <rect x="0" y="-30" width="122" height="44" rx="22" fill="#c2566b"/>
        <text x="61" y="0" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">OUTSIDE</text>
      </g>

      <!-- recording UI -->
      <rect x="0" y="0" width="420" height="78" fill="#000" opacity="0.35"/>
      <circle cx="152" cy="46" r="10" fill="#e5484d"/>
      <text x="172" y="54" font-size="22" font-weight="700" fill="#ffffff">REC 04:32</text>
      <rect x="0" y="690" width="420" height="130" fill="#000" opacity="0.35"/>
      <circle cx="210" cy="752" r="40" fill="none" stroke="#ffffff" stroke-width="6"/>
      <rect x="192" y="734" width="36" height="36" rx="8" fill="#e5484d"/>
    </g>
  </g>
</svg>
