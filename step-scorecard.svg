<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#3a2a2e"/>
      <stop offset="0.55" stop-color="#1e1719"/>
      <stop offset="1" stop-color="#0d0b0c"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1ed"/>
      <stop offset="1" stop-color="#e9ded6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9c5966" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9c5966" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="800" cy="520" rx="640" ry="420" fill="url(#glow)"/>

  <!-- the scorecard sheet -->
  <g transform="rotate(-4 800 500)" filter="url(#shadow)">
    <rect x="430" y="95" width="740" height="840" rx="18" fill="url(#paper)"/>
    <rect x="430" y="95" width="740" height="16" rx="8" fill="#401b27"/>

    <text x="486" y="185" font-size="22" font-weight="700" letter-spacing="5" fill="#9c5966">SOVEREIGN DAN</text>
    <text x="486" y="236" font-size="46" font-weight="800" fill="#191719">Hinge Scorecard</text>
    <line x1="486" y1="268" x2="1114" y2="268" stroke="#d9cbc2" stroke-width="2"/>

    <!-- score ring -->
    <circle cx="1034" cy="196" r="58" fill="none" stroke="#e3d6ce" stroke-width="12"/>
    <circle cx="1034" cy="196" r="58" fill="none" stroke="#401b27" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="262 365" transform="rotate(-90 1034 196)"/>
    <text x="1034" y="208" text-anchor="middle" font-size="38" font-weight="800" fill="#191719">72</text>

    <!-- rows -->
    <g font-size="25" fill="#191719">
      <g transform="translate(0 320)">
        <circle cx="503" cy="0" r="17" fill="#401b27"/><path d="M494 0 l6 6 l11 -12" stroke="#f6f1ed" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="540" y="9">Physique and grooming</text>
        <rect x="860" y="-8" width="180" height="16" rx="8" fill="#e3d6ce"/><rect x="860" y="-8" width="126" height="16" rx="8" fill="#401b27"/>
        <text x="1114" y="9" text-anchor="end" font-weight="700">14/20</text>
      </g>
      <g transform="translate(0 395)">
        <circle cx="503" cy="0" r="17" fill="#401b27"/><path d="M494 0 l6 6 l11 -12" stroke="#f6f1ed" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="540" y="9">Style</text>
        <rect x="860" y="-8" width="180" height="16" rx="8" fill="#e3d6ce"/><rect x="860" y="-8" width="144" height="16" rx="8" fill="#401b27"/>
        <text x="1114" y="9" text-anchor="end" font-weight="700">16/20</text>
      </g>
      <g transform="translate(0 470)">
        <circle cx="503" cy="0" r="17" fill="none" stroke="#9c5966" stroke-width="3"/><path d="M496 -7 l14 14 M510 -7 l-14 14" stroke="#9c5966" stroke-width="4" stroke-linecap="round"/>
        <text x="540" y="9">Photo setting</text>
        <rect x="860" y="-8" width="180" height="16" rx="8" fill="#e3d6ce"/><rect x="860" y="-8" width="72" height="16" rx="8" fill="#9c5966"/>
        <text x="1114" y="9" text-anchor="end" font-weight="700">4/10</text>
      </g>
      <g transform="translate(0 545)">
        <circle cx="503" cy="0" r="17" fill="#401b27"/><path d="M494 0 l6 6 l11 -12" stroke="#f6f1ed" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="540" y="9">Presence</text>
        <rect x="860" y="-8" width="180" height="16" rx="8" fill="#e3d6ce"/><rect x="860" y="-8" width="144" height="16" rx="8" fill="#401b27"/>
        <text x="1114" y="9" text-anchor="end" font-weight="700">8/10</text>
      </g>
      <g transform="translate(0 620)">
        <circle cx="503" cy="0" r="17" fill="none" stroke="#9c5966" stroke-width="3"/><path d="M496 -7 l14 14 M510 -7 l-14 14" stroke="#9c5966" stroke-width="4" stroke-linecap="round"/>
        <text x="540" y="9">Prompts</text>
        <rect x="860" y="-8" width="180" height="16" rx="8" fill="#e3d6ce"/><rect x="860" y="-8" width="54" height="16" rx="8" fill="#9c5966"/>
        <text x="1114" y="9" text-anchor="end" font-weight="700">3/10</text>
      </g>
      <g transform="translate(0 695)">
        <circle cx="503" cy="0" r="17" fill="#401b27"/><path d="M494 0 l6 6 l11 -12" stroke="#f6f1ed" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="540" y="9">Chats</text>
        <rect x="860" y="-8" width="180" height="16" rx="8" fill="#e3d6ce"/><rect x="860" y="-8" width="126" height="16" rx="8" fill="#401b27"/>
        <text x="1114" y="9" text-anchor="end" font-weight="700">28/40</text>
      </g>
    </g>

    <line x1="486" y1="752" x2="1114" y2="752" stroke="#d9cbc2" stroke-width="2"/>
    <text x="486" y="800" font-size="22" font-weight="700" letter-spacing="4" fill="#9c5966">YOUR TOP 3 FIXES</text>
    <g font-size="23" fill="#4a3d3f">
      <text x="486" y="844"><tspan font-weight="700" fill="#191719">1.</tspan> Retake your photos outside</text>
      <text x="486" y="880"><tspan font-weight="700" fill="#191719">2.</tspan> Cut the boyfriend prompts</text>
    </g>
  </g>
</svg>
